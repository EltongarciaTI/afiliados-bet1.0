<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Afiliados Bet | Entrar</title>
  <link rel="icon" type="image/png" href="assets/afnex/images/favi.png">
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/afnex/styles.css">
  <link rel="stylesheet" href="assets/afnex/login.css">
  <link rel="stylesheet" href="assets/afnex/notifications.css">

  <style>
    .login-box {
      background: #0a0a0a !important;
      border: 1px solid rgba(255,255,255,.1) !important;
      box-shadow: 0 8px 40px rgba(0,0,0,.7) !important;
    }
    .login-logo .logo-img {
      filter: drop-shadow(0 0 12px rgba(0,210,91,.4));
    }
    .login-title {
      font-size: 1.4rem !important;
      font-weight: 700 !important;
      color: #e8eaed !important;
      text-align: center;
      margin-bottom: .25rem !important;
    }
    .login-form label { color: #6c7293 !important; font-size: .72rem !important; font-weight: 700 !important; text-transform: uppercase; letter-spacing: .07em; }
    .login-form input {
      background: #181818 !important;
      border: 1px solid rgba(255,255,255,.08) !important;
      color: #e8eaed !important;
      border-radius: 10px !important;
      padding: .8rem 1rem !important;
      transition: border-color .2s, box-shadow .2s;
    }
    .login-form input:focus {
      border-color: rgba(0,210,91,.5) !important;
      box-shadow: 0 0 0 3px rgba(0,210,91,.12) !important;
      outline: none;
    }
    .btn-primary.btn-login, button[type=submit] {
      background: linear-gradient(135deg, #00d25b, #00b34a) !important;
      border: none !important;
      border-radius: 10px !important;
      font-weight: 700 !important;
      font-size: .95rem !important;
      padding: .85rem !important;
      box-shadow: 0 4px 18px rgba(0,210,91,.35) !important;
      color: #fff !important;
      transition: opacity .2s !important;
    }
    .btn-primary.btn-login:hover, button[type=submit]:hover { opacity: .9 !important; }
    .admin-access { margin-top: 14px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
    .admin-access a { display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:.85rem; color:rgba(108,114,147,.8); text-decoration:none; transition:color .2s; }
    .admin-access a:hover { color: #00d25b; }
    .admin-lock { width:16px; height:16px; display:inline-block; }
    .form-message { margin-top:12px; font-size:.88rem; color:#fc4b6c; min-height:18px; text-align:center; }
    .login-footer { text-align:center; font-size:.83rem; color:#6c7293; margin-top:1rem; }
    .login-footer a { color:#00d25b; text-decoration:none; font-weight:600; }
    .login-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <a class="login-logo" href="index.html" aria-label="Voltar para a página inicial">
        <img src="assets/afnex/images/logo.png" alt="Afiliados Bet" class="logo-img">
      </a>

      <h2 class="login-title" id="modeTitle">Entrar</h2>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Seu email" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Sua senha" required autocomplete="current-password">
        </div>

        <button id="btnLogin" type="submit" class="btn-primary btn-login">Entrar</button>

        <div id="msg" class="form-message"></div>

        <div class="admin-access">
          <a href="entrar-admin.html" title="Acesso restrito do administrador">
            <svg class="admin-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Área do Admin (acesso restrito)
          </a>
        </div>

        <p class="login-footer">
          Ainda não tem conta? <a href="index.html#cadastro">Cadastre-se</a>
        </p>
      </form>
    </div>
  </div>

  <script type="module" src="assets/js/app/entrar.js"></script>
</body>
</html>
