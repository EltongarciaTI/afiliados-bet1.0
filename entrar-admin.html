<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Afiliados Bet | Admin</title>
  <link rel="icon" type="image/png" href="assets/afnex/images/favi.png">
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/afnex/styles.css">
  <link rel="stylesheet" href="assets/afnex/login.css">
  <link rel="stylesheet" href="assets/afnex/notifications.css">

  <style>
    .login-box {
      background: #0a0a0a !important;
      border: 1px solid rgba(255,255,255,.1) !important;
      box-shadow: 0 8px 40px rgba(0,0,0,.7) !important;
    }
    .login-logo .logo-img {
      filter: drop-shadow(0 0 12px rgba(0,210,91,.4));
    }
    .login-title {
      font-size: 1.4rem !important;
      font-weight: 700 !important;
      color: #e8eaed !important;
      text-align: center;
      margin-bottom: .25rem !important;
    }
    .login-form label { color: #6c7293 !important; font-size: .72rem !important; font-weight: 700 !important; text-transform: uppercase; letter-spacing: .07em; }
    .login-form input {
      background: #181818 !important;
      border: 1px solid rgba(255,255,255,.08) !important;
      color: #e8eaed !important;
      border-radius: 10px !important;
      padding: .8rem 1rem !important;
      transition: border-color .2s, box-shadow .2s;
    }
    .login-form input:focus {
      border-color: rgba(0,210,91,.5) !important;
      box-shadow: 0 0 0 3px rgba(0,210,91,.12) !important;
      outline: none;
    }
    .btn-primary.btn-login, button[type=submit] {
      background: linear-gradient(135deg, #00d25b, #00b34a) !important;
      border: none !important;
      border-radius: 10px !important;
      font-weight: 700 !important;
      font-size: .95rem !important;
      padding: .85rem !important;
      box-shadow: 0 4px 18px rgba(0,210,91,.35) !important;
      color: #fff !important;
      transition: opacity .2s !important;
    }
    .btn-primary.btn-login:hover, button[type=submit]:hover { opacity: .9 !important; }
    .admin-badge {
      margin: 8px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      background: rgba(0,210,91,.08);
      border: 1px solid rgba(0,210,91,.2);
      border-radius: 20px;
      padding: .35rem .9rem;
      width: fit-content;
      color: #00d25b;
      font-weight: 600;
      font-size: .82rem;
    }
    .admin-badge svg { width: 15px; height: 15px; stroke: #00d25b; }
    .form-message { margin-top:12px; font-size:.88rem; color:#fc4b6c; min-height:18px; text-align:center; }
    .back-affiliate { margin-top:14px; display:flex; justify-content:center; }
    .back-affiliate a { color:#6c7293; font-weight:600; text-decoration:none; font-size:.85rem; transition:color .2s; }
    .back-affiliate a:hover { color:#00d25b; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <a class="login-logo" href="index.html" aria-label="Voltar para a página inicial">
        <img src="assets/afnex/images/logo.png" alt="Afiliados Bet" class="logo-img">
      </a>

      <h2 class="login-title">Entrar no Admin</h2>
      <div class="admin-badge" title="Acesso restrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Acesso restrito (owner)
      </div>

      <form id="adminLoginForm" class="login-form" style="margin-top:18px;">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Seu email de admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Sua senha" required autocomplete="current-password">
        </div>

        <button id="btnLogin" type="submit" class="btn-primary btn-login">Entrar no Admin</button>

        <div id="msg" class="form-message"></div>

        <div class="back-affiliate">
          <a href="entrar.html">⬅ Voltar para login do afiliado</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="assets/js/app/entrarAdmin.js"></script>
</body>
</html>
