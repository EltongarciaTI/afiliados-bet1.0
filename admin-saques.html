  .kpi-comm-lbl { font-size: .7rem; color: #6c7293; margin-top: .18rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

  .kpi-comm--yellow .kpi-comm-icon { background: rgba(255,171,0,.12); color: #ffab00; }
  .kpi-comm--blue { border-left: 3px solid #0090ff; }
  .kpi-comm--blue .kpi-comm-icon { background: rgba(0,144,255,.12); color: #0090ff; }
  .kpi-comm--green { border-left: 3px solid #00d25b; }
  .kpi-comm--green .kpi-comm-icon { background: rgba(0,210,91,.12); color: #00d25b; }
  .kpi-comm--red { border-left: 3px solid #fc4b6c; }
  .kpi-comm--red .kpi-comm-icon { background: rgba(252,75,108,.12); color: #fc4b6c; }

    background: #252836 !important; border: 1px solid rgba(255,255,255,.08) !important; color: #e8eaed !important; border-radius: 8px !important;
  }
  .form-control:focus, .form-select:focus { background: #252836 !important; color: #e8eaed !important; box-shadow: 0 0 0 2px rgba(0,210,91,.2) !important; border-color: rgba(0,210,91,.5) !important; }

  .table-responsive { border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.06); }
  .table { margin-bottom: 0 !important; }
  .table thead tr { background: rgba(0,0,0,.22); }
  .table thead th { font-size: .65rem !important; text-transform: uppercase !important; letter-spacing: .1em !important; color: #6c7293 !important; font-weight: 700 !important; white-space: nowrap; border-bottom: 1px solid rgba(255,255,255,.08) !important; padding: .85rem 1rem !important; }

  .table-striped tbody tr:nth-of-type(odd) td { background: rgba(255,255,255,.02) !important; }
  .table tbody tr:hover td { background: rgba(0,210,91,.05) !important; transition: background .15s; }

  .badge-status { font-size: .72rem; padding: .3em .75em; border-radius: 20px; font-weight: 700; }
  .bg-success   { background: rgba(0,210,91,.15)   !important; color: #00d25b !important; border: 1px solid rgba(0,210,91,.3)   !important; }
  .bg-info      { background: rgba(0,144,255,.15)   !important; color: #3fb0ff !important; border: 1px solid rgba(0,144,255,.3)  !important; }
  .bg-danger    { background: rgba(252,75,108,.15)  !important; color: #fc4b6c !important; border: 1px solid rgba(252,75,108,.3) !important; }
  .bg-secondary { background: rgba(108,114,147,.15) !important; color: #8a8fad !important; border: 1px solid rgba(108,114,147,.3)!important; }

  .sidebar { background: #161827 !important; border-right: 1px solid rgba(255,255,255,.06) !important; }
  .sidebar .sidebar-brand-wrapper { background: #161827 !important; border-bottom: 1px solid rgba(255,255,255,.06) !important; }

  /* ── Navbar ── */
