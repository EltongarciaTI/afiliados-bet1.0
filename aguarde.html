<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Afiliados Bet | Aguardando aprovação</title>
  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
  <link rel="icon" href="assets/img/afiliados-bet/favicon.ico" type="image/x-icon" />

  <!-- Corona (dark) styles -->
  <link rel="stylesheet" href="assets/corona/vendors/mdi/css/materialdesignicons.min.css" />
  <link rel="stylesheet" href="assets/corona/vendors/css/vendor.bundle.base.css" />
  <link rel="stylesheet" href="assets/corona/css/style.css" />

  <style>
    body, .container-scroller, .page-body-wrapper, .content-wrapper { background: #000000 !important; }
    .full-page-wrapper { background: #000000 !important; }
    .auth.login-bg { background: #000000 !important; }
    .card {
      background: #0a0a0a !important;
      border: 1px solid rgba(255,255,255,.1) !important;
      border-radius: 16px !important;
      box-shadow: 0 8px 40px rgba(0,0,0,.7) !important;
    }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand img { height: 48px; filter: drop-shadow(0 0 10px rgba(0,210,91,.4)); }
    .card-title { font-weight: 700 !important; color: #e8eaed !important; }
    .muted { color: #6c7293; }
    h4 { color: #e8eaed; font-weight: 700; }
    p { color: #8a8fad; }
    .btn-outline-light {
      border-color: rgba(255,255,255,.15) !important;
      color: #8a8fad !important;
      border-radius: 8px !important;
      transition: all .2s;
    }
    .btn-outline-light:hover { background: rgba(255,255,255,.06) !important; color: #e8eaed !important; }
    .btn-danger {
      background: rgba(252,75,108,.15) !important;
      border: 1px solid rgba(252,75,108,.3) !important;
      color: #fc4b6c !important;
      border-radius: 8px !important;
    }
    .btn-danger:hover { background: rgba(252,75,108,.25) !important; }
    /* ícone de espera animado */
    .wait-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,210,91,.15), rgba(0,144,255,.15));
      border: 1px solid rgba(0,210,91,.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,210,91,.3); }
      50% { box-shadow: 0 0 0 10px rgba(0,210,91,0); }
    }
  </style>
</head>
<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="row w-100 m-0">
        <div class="content-wrapper full-page-wrapper d-flex align-items-center auth login-bg">
          <div class="card col-lg-5 mx-auto">
            <div class="card-body px-5 py-5">

              <div class="brand mb-4">
                <img src="assets/afnex/imagens/logo.png" alt="Afiliados Bet" />
                <div>
                  <h3 class="card-title text-left mb-0">Afiliados Bet</h3>
                  <div class="muted small">Cadastro recebido</div>
                </div>
              </div>

              <div class="wait-icon">
                <i class="mdi mdi-clock-outline" style="font-size:1.6rem;color:#00d25b;"></i>
              </div>

              <h4 class="mb-3" style="text-align:center;">Obrigado por se cadastrar!</h4>
              <p class="muted" style="text-align:center;">Seu cadastro está <strong style="color:#ffab00;">pendente de aprovação</strong>. Aguarde o gerente aprovar sua conta para acessar o painel.</p>

              <div class="mt-4 d-flex flex-column flex-sm-row gap-2">
                <a class="btn btn-outline-light" href="entrar.html">
                  <i class="mdi mdi-login"></i> Voltar para o login
                </a>
                <button class="btn btn-danger" id="btnLogout">
                  <i class="mdi mdi-logout"></i> Sair
                </button>
              </div>

              <div class="mt-4 small muted" id="who"></div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/corona/vendors/js/vendor.bundle.base.js"></script>
  <script type="module" src="assets/js/app/aguarde.js"></script>
</body>
</html>
